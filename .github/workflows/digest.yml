name: FPL digest

on:
  schedule:
    # Times are UTC. Malta is UTC+2 (summer) / UTC+1 (winter).
    - cron: "0 1 * * *"    # after overnight price changes settle
    - cron: "30 6 * * *"   # before the morning brief
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build digest
        env:
          FPL_ENTRY_ID: ${{ vars.FPL_ENTRY_ID }}
        run: python fpl_digest.py

      - name: Probable XIs
        run: python probable_xi.py

      - name: Mini-league intel (skips cleanly before GW1 is played)
        env:
          FPL_ENTRY_ID: ${{ vars.FPL_ENTRY_ID }}
        run: python league_intel.py || echo "league intel skipped"

      - name: Commit snapshot and digest
        run: |
          git config user.name  "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No change this run."
          else
            git commit -m "digest $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
